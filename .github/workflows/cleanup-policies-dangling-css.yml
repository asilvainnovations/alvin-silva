name: Clean dangling policy CSS

on:
  push:
    branches:
      - feat/support-page-policy-cleanup
    paths:
      - policies.html
      - .github/workflows/cleanup-policies-dangling-css.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/support-page-policy-cleanup
          fetch-depth: 0

      - name: Remove dangling ASilva floating-widget CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("policies.html")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"\n/\* ============ ASILVA FLOATING WIDGET ============ \*/.*?"
              r"(?=\n(?:</body>|<footer|<script|</html>))",
              re.DOTALL,
          )

          cleaned, count = pattern.subn("", text, count=1)

          if count:
              path.write_text(cleaned, encoding="utf-8")
              print("Removed dangling ASILVA floating-widget CSS from policies.html")
          else:
              print("Dangling ASILVA floating-widget CSS was not found; no change required")

      - name: Commit cleanup when needed
        shell: bash
        run: |
          if git diff --quiet -- policies.html; then
            echo "No policy cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policies.html
          git commit -m "fix: remove dangling CSS from policies page"
          git push origin HEAD:feat/support-page-policy-cleanup
