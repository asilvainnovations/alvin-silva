# Give the workflow a descriptive name.
name: Validate Static Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' javascript_file; do
            echo "Checking ${javascript_file}"
            node --check "${javascript_file}"
          done < <(find . -type f -name "*.js" -not -path "./.git/*" -print0)

      - name: Validate static-site dependencies and HTML
        run: node scripts/validate-static-site.mjs

      - name: Validate credentials path regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number \
            --exclude-dir=.git \
            "fetch(['\"]assets/credentials.json['\"])" .; then
            echo "Invalid credentials path detected."
            exit 1
          fi

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f portfolio.html
          test -f credentials.json
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/css/core.css
          test -f assets/css/components.css
          test -f assets/css/visualizations.css
          test -f assets/asilva-widget.js
          test -f assets/data/system-architecture.json
          echo "Required production files are present."
