# Give the workflow a descriptive name.
name: Validate Static Site

# Run validation whenever code reaches or targets the main branch.
on:
  # Validate direct pushes.
  push:
    # Restrict validation to the production branch.
    branches:
      - main
  # Validate proposed changes before they are merged.
  pull_request:
    # Restrict validation to pull requests targeting production.
    branches:
      - main

# Apply least-privilege permissions.
permissions:
  # The workflow only needs repository read access.
  contents: read

# Define the validation job.
jobs:
  # Create one deterministic validation job.
  validate:
    # Use the current Ubuntu runner.
    runs-on: ubuntu-latest

    # Define the validation sequence.
    steps:
      # Download the repository.
      - name: Checkout repository
        # Use GitHub's maintained checkout action.
        uses: actions/checkout@v4

      # Install Node.js for JavaScript syntax validation.
      - name: Configure Node.js
        # Use GitHub's maintained Node setup action.
        uses: actions/setup-node@v4
        # Configure the runtime.
        with:
          # Use the current long-term-support generation.
          node-version: "22"

      # Validate every standalone JavaScript file.
      - name: Validate JavaScript syntax
        # Stop immediately when any JavaScript file is invalid.
        shell: bash
        # Execute Node's parser against every JavaScript source file.
        run: |
          set -euo pipefail
          while IFS= read -r -d '' javascript_file; do
            echo "Checking ${javascript_file}"
            node --check "${javascript_file}"
          done < <(find . -type f -name "*.js" -print0)

      # Detect the historically broken credentials reference.
      - name: Validate credentials path
        # Use Bash for a lightweight static regression test.
        shell: bash
        # Fail when the obsolete path reappears.
        run: |
          set -euo pipefail
          if grep -R --line-number \
            --exclude-dir=.git \
            "fetch(['\"]assets/credentials.json['\"])" .; then
            echo "Invalid credentials path detected."
            exit 1
          fi

      # Check required production files.
      - name: Validate required files
        # Use Bash for deterministic file checks.
        shell: bash
        # Verify the critical static-site resources.
        run: |
          set -euo pipefail
          test -f index.html
          test -f portfolio.html
          test -f credentials.json
          test -f manifest.webmanifest
          test -f sw.js
          echo "Required files are present."
